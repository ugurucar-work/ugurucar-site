<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>App Marketing Tycoon</title>
<meta name="description" content="Launch your app and market it for a year. Make creatives, run Meta, TikTok and Google ads, hire a team and try to turn a profit in 52 weeks. A free browser game about mobile app marketing.">
<meta name="theme-color" content="#2E44D4">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="App Marketing Tycoon">
<meta property="og:description" content="Launch your app and market it for a year. Make creatives, run Meta, TikTok and Google ads, hire a team and try to turn a profit in 52 weeks. A free browser game about mobile app marketing.">
<meta name="twitter:card" content="summary">
<style>html,body{margin:0;padding:0}</style>
<link rel="stylesheet" href="fonts.css">
<style>
/* Layout: ad-ops console. Sticky command bar, side nav, working panels; numbers in mono. */
:root{
  --bg:#EDEFF5; --panel:#FFFFFF; --panel-2:#F4F5FA; --ink:#151A30; --muted:#5B6382; --line:#DADEEA;
  --accent:#2E44D4; --accent-ink:#FFFFFF; --accent-soft:#E2E6FC;
  --spend:#C2336A; --good:#14805A; --warn:#A86F12; --bad:#C3362C; --win:#8A5A00; --win-soft:#FBEFC9;
  --f-display:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1020; --panel:#151A2D; --panel-2:#1B2037; --ink:#E6E8F3; --muted:#959DBE; --line:#29304E;
  --accent:#8090FF; --accent-ink:#0D1020; --accent-soft:#232A55;
  --spend:#F06B9C; --good:#3FC98A; --warn:#E5AE4A; --bad:#F2695F; --win:#F5CB5C; --win-soft:#3A3018; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1020; --panel:#151A2D; --panel-2:#1B2037; --ink:#E6E8F3; --muted:#959DBE; --line:#29304E;
  --accent:#8090FF; --accent-ink:#0D1020; --accent-soft:#232A55;
  --spend:#F06B9C; --good:#3FC98A; --warn:#E5AE4A; --bad:#F2695F; --win:#F5CB5C; --win-soft:#3A3018; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:22px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}

.btn{font:600 13px/1 var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:9px 14px;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{padding:12px 20px;font-size:14px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.xs{padding:5px 8px;font-size:12px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:1560px;margin:0 auto;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:800;font-size:19px;flex:none}
.bn{display:flex;flex-direction:column;min-width:0}
.bn strong{font-family:var(--f-display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bn span{font-size:12px;color:var(--muted)}
.stat{display:flex;flex-direction:column;gap:1px}
.stat .v{font-family:var(--f-mono);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}
.stat .v small{color:var(--muted);font-size:13px}
.stat .s{font-size:11.5px;color:var(--muted)}
.grow{flex:1}

/* shell */
.shell{max-width:1560px;margin:0 auto;display:grid;grid-template-columns:190px minmax(0,1fr);gap:24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 48px}
/* the sidebar is its own fixed layer: it never scrolls with the page, and scrolls inside itself when the screen is short */
nav.side{display:flex;flex-direction:column;gap:2px;position:fixed;z-index:15;top:calc(var(--toph,76px) + 14px);bottom:12px;left:max(max(16px,env(safe-area-inset-left,0px)),calc((100vw - 1560px) / 2 + 16px));width:190px;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line) transparent;padding:2px 4px 4px 0}
nav.side::-webkit-scrollbar{width:6px}nav.side::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.shell > main{grid-column:2}
nav.side .newgame{margin-top:6px;border-top:1px solid var(--line);border-radius:0 0 8px 8px;padding-top:12px}
nav.side button{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;font:500 14px var(--f-body);color:var(--muted);background:transparent;border:0;border-radius:8px;padding:10px 12px;cursor:pointer;white-space:nowrap}
nav.side button:hover{color:var(--ink);background:var(--panel)}
nav.side button[aria-current="page"]{color:var(--ink);background:var(--panel);box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
.badge{font:600 11px var(--f-mono);background:var(--spend);color:#fff;border-radius:99px;padding:1px 7px}
.badge.live{background:var(--good)}
main{min-width:0;display:flex;flex-direction:column;gap:18px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head p{color:var(--muted);max-width:66ch;margin-top:4px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--muted)}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.mini{background:var(--panel-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.mini b{font:700 20px var(--f-display);font-variant-numeric:tabular-nums}

.meter{height:8px;background:var(--panel-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter.spend>i{background:var(--spend)}
.meter.sm{height:5px}
.meter.prod>i{background:var(--good);transition:width .25s linear}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 13%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.pill.acc{color:var(--accent);background:var(--accent-soft)}
.pill.win{color:var(--win);background:var(--win-soft)}

.scroll{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;font-family:var(--f-body)}
.tbl tr.total td{font-weight:600;border-bottom:0}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart .grid line{stroke:var(--line)}
.chart text{fill:var(--muted);font:11px var(--f-mono)}
.ln-rev{stroke:var(--accent);fill:none;stroke-width:2.2}
.ar-rev{fill:var(--accent);opacity:.12}
.ln-mrr{stroke:var(--good);fill:none;stroke-width:2}
.ln-cost{stroke:var(--spend);fill:none;stroke-width:2;stroke-dasharray:5 4}
.dot-rev{fill:var(--accent)} .dot-cost{fill:var(--spend)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}

/* ad cards */
.adcard{display:flex;flex-direction:column;gap:14px}
.adcard .hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.adcard .hd h3{font-size:18px}
.chlogo{color:var(--ink);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:800 13px var(--f-display);flex:none;background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}
.switch{width:44px;height:26px;border-radius:99px;border:1px solid var(--line);background:var(--panel-2);position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.switch[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-pressed="true"]::after{transform:translateX(18px);background:var(--accent-ink)}
.switch.sm{width:36px;height:22px}
.switch.sm::after{width:14px;height:14px}
.switch.sm[aria-pressed="true"]::after{transform:translateX(14px)}
.field{display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
@media (max-width:520px){.row{flex-wrap:wrap}}
input[type=range]{width:100%;accent-color:var(--accent)}
select,input[type=text]{width:100%;font:14px var(--f-body);color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px 12px;background:var(--panel-2);border-radius:10px;padding:12px}
.stats div{display:flex;flex-direction:column;gap:2px;min-width:0}
.stats b{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums}
.stats span{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stats .empty{grid-column:1/-1;color:var(--muted);font-size:13px}
.crrows{display:flex;flex-direction:column;gap:6px}
.crchip .adp{margin:-7px -26px 2px -9px;border-radius:0;aspect-ratio:2.2/1}
.crchip .adp .spons{display:none}.crchip .adp .shead{font-size:9.5px;top:18%}.crchip .adp .cap,.crchip .adp .subt{font-size:8.5px;padding:3px 5px}.crchip .adp .scta{font-size:7.5px;padding:2px 7px}
.crchip .xbtn{z-index:2;background:rgba(255,255,255,.9)}
.fun{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 2px}
.fbar{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:7px 10px;border-radius:8px;background:color-mix(in srgb,var(--accent) calc(var(--o) * 100%),var(--panel-2));color:var(--accent-ink);min-width:150px;transition:width .4s}
.fbar b{font:700 14px var(--f-mono)}.fbar span{font-size:11.5px;opacity:.9}
.frate{font:600 11px var(--f-mono);color:var(--muted)}.frate span{font-family:var(--f-body);font-weight:500}
.crchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.crchip{position:relative;display:flex;flex-direction:column;gap:4px;padding:7px 26px 9px 9px;border-radius:8px;background:var(--panel-2);overflow:hidden;min-width:0}
.crchip b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crchip .cm{display:flex;align-items:center;justify-content:space-between;gap:6px}.crchip .cm .pill{font-size:10.5px;padding:1px 7px}
.crchip .sh{font:500 11.5px var(--f-mono);color:var(--muted)}
.crchip .fat{position:absolute;left:0;bottom:0;height:3px;background:var(--warn,#F5A524);opacity:.8}
.crchip .xbtn{position:absolute;top:4px;right:4px;width:20px;height:20px;font-size:13px}
.crrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;background:var(--panel-2)}
.crrow .nm{display:flex;flex-direction:column;gap:3px;min-width:0}
.crrow .nm b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crrow .sh{font:500 12px var(--f-mono);text-align:right;color:var(--muted)}
.xbtn{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:4px 6px;border-radius:6px}
.xbtn:hover{color:var(--bad);background:var(--panel)}

/* segmented */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}

/* clicker */
.clicker{position:relative;width:100%;border:2px dashed var(--line);background:var(--panel-2);color:var(--ink);border-radius:14px;padding:22px 16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;font:600 15px var(--f-body);user-select:none;transition:transform .06s,border-color .15s}
.clicker:hover{border-color:var(--accent)}
.clicker:active{transform:scale(.985)}
.clicker .big{font:800 22px var(--f-display)}
.clicker .step{font:400 13px var(--f-body);color:var(--muted);min-height:1.4em}
.oddsbar{display:flex;height:10px;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.oddsbar i{display:block;height:100%}
.oddsbar .o-flop{background:var(--bad);opacity:.55}
.oddsbar .o-vasat{background:var(--muted);opacity:.35}
.oddsbar .o-iyi{background:var(--good)}
.oddsbar .o-win{background:var(--win)}
.oddsleg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.oddsleg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.bigpct{font:800 34px var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--win)}

.worker{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:10px;background:var(--panel-2)}

/* creatives */
.crlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.cr{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.cr.w{border-color:var(--win);box-shadow:0 0 0 3px var(--win-soft)}
.cr .thumb{aspect-ratio:3/2;border-radius:8px;background:var(--panel-2);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:8px;max-width:100%}
.cr .thumb::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,var(--accent-soft),transparent 70%)}
.cr.w .thumb::before{background:linear-gradient(160deg,var(--win-soft),transparent 75%)}
.cr .thumb span{position:relative;font:700 13px var(--f-display);line-height:1.15}
.cr .thumb em{position:absolute;top:8px;right:8px;font:500 10.5px var(--f-mono);font-style:normal;color:var(--muted)}
.cr.new{animation:flash 1.2s ease-out}
@keyframes flash{from{box-shadow:0 0 0 4px var(--accent-soft)}to{box-shadow:none}}

/* team */
.person{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:9px;background:var(--panel)}
.person.star{border-color:var(--accent)}
.person .who{display:flex;gap:10px;align-items:center}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--f-display);background:var(--accent-soft);color:var(--accent);flex:none}
.person .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}

/* inbox */
.msg{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--panel);display:flex;flex-direction:column;gap:10px}
.msg.open{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.msg .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.msg p{max-width:68ch}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices .btn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;line-height:1.2}
.choices .btn small{font-weight:400;color:var(--muted);font-size:12px}
.result{font-size:13px;padding:10px 12px;border-radius:8px;background:var(--panel-2)}

.checklist{display:flex;flex-direction:column;gap:8px;margin:10px 0 0;padding:0;list-style:none}
.checklist li{display:flex;gap:10px;align-items:flex-start}
.checklist .box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);flex:none;margin-top:1px;display:grid;place-items:center;font-size:12px;color:#fff}
.checklist .ok .box{background:var(--good);border-color:var(--good)}
.checklist .ok span{color:var(--muted);text-decoration:line-through}

.notes{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.notes li{font-size:13px;padding:8px 10px;border-radius:8px;background:var(--panel-2);border-left:3px solid var(--line)}
.notes li.good{border-color:var(--good)} .notes li.warn{border-color:var(--warn)} .notes li.bad{border-color:var(--bad)} .notes li.info{border-color:var(--accent)} .notes li.win{border-color:var(--win);background:var(--win-soft)}

/* dialog bubble */
.say{display:flex;gap:12px;align-items:flex-start}
.say .bubble{position:relative;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;max-width:62ch}
.say .bubble b{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:2px}
#dialog{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:55;max-width:min(420px,calc(100% - 32px))}
#dialog .say{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 10px 30px color-mix(in srgb,#05060d 22%,transparent);animation:pop .25s ease-out}
#dialog .bubble{background:transparent;border:0;padding:0}

/* modal */
.overlay{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,#05060d 55%,transparent);display:grid;place-items:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:16px;width:100%;max-width:760px;max-height:100%;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:18px;animation:pop .22s ease-out}
@keyframes pop{from{transform:translateY(8px) scale(.98)}to{transform:none}}
.bigrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.bigrow div{display:flex;flex-direction:column;gap:2px}
.bigrow b{font:700 24px var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.callout{font-size:13px;padding:12px 14px;border-radius:10px;background:var(--accent-soft);color:var(--ink)}

.wi{display:inline-grid;place-items:center;cursor:help;vertical-align:middle;width:16px;height:16px;border-radius:50%;background:#F5A524;color:#1A1300;font:800 11px/1 var(--f-body);margin-left:6px}

function pushEvent(eid, data = {}) {
  if (eid === 'team' || eid === 'creators') state.inbox = state.inbox.filter(i => i.eid !== eid);
  state.seen.push(eid);

function rollEvents() {
  const s = state, w = s.week;
  (s.prof ? s.prof.seasons : []).forEach((z, i) => { if (z.from === w + 1) pushEvent('season', { i }); });
  if (w === 2) { pushEvent('expand'); pushEvent('pixelhint'); }
  if (w === 9) pushEvent('ios');
  if (w === 24) { const now = s.subStat.mrr, target = Math.round(Math.max(30000, now * 2.2) * (s.raised ? .8 : 1) / 5000) * 5000; pushEvent('seriesGoal', { target, now }); }
  if (w === 34) pushEvent('surge');
  if (w === 40 && s.seriesA && s.seriesA.status === 'open') {
    const mrr = s.subStat.mrr;
    if (mrr >= s.seriesA.target) pushEvent('seriesOffer', { mrr, amount: Math.round(Math.max(750000, valuation().val * .25) / 50000) * 50000 });

  }
  if (w === 21) pushEvent('bf');

  if (!s.reviewWeek) s.reviewWeek = 14 + Math.floor(Math.random() * 17);
  if (!s.seen.includes('review') && w >= s.reviewWeek && EVENTS.review.cond(s)) { pushEvent('review'); return; }

  if (EVENTS.rescue.cond(s)) { s.rescueRoll = true; if (Math.random() < .6) { pushEvent('rescue', EVENTS.rescue.data(s)); return; } }
  if (!s.seen.includes('investor') && EVENTS.investor.cond(s)) { pushEvent('investor', EVENTS.investor.data(s)); return; }
  if (w > 3 && Math.random() < .42) {
    const pool = Object.keys(EVENTS).filter(k => EVENTS[k].random && !s.seen.includes(k) && (!EVENTS[k].cond || EVENTS[k].cond(s)));
    if (pool.length) { const k = pick(pool); pushEvent(k, EVENTS[k].data ? EVENTS[k].data(s) : {}); }
  }
}

// auto-rotate: each week, pull tired or flopped creatives out and fill the slots with proven and fresh ones
function autoRefresh(cp, notes) {
  if (cp.kind === 'test') return testRefresh(cp, notes);

  const goods = state.creatives.filter(c => testedOn(c, ch) && (tierOf(c, ch) === 'winner' || (tierOf(c, ch) === 'iyi' && !(c.tin && c.tin[ch] === 'test'))) && c.fatigue < .5 && !cp.crs.includes(c.id)).sort((a, b) => qOf(b, ch) - qOf(a, ch));

  const testing = state.camps.some(x => x.ch === ch && x.kind === 'test' && x.on);
  const fresh = state.creatives.filter(c => !testedOn(c, ch) && !cp.crs.includes(c.id));

function chart() {

// impressions → clicks → results, drawn as a narrowing funnel
function funnel(L, ads) {
  if (!L || L.paused || !L.imp) return '';
  const st = [['Impressions', L.imp], ['Clicks', L.clicks], [ads ? 'Installs' : 'Purchases', L.reported]];
  const mx = Math.log10(Math.max(10, L.imp));
  const w = v => Math.max(18, Math.min(100, 100 * Math.log10(Math.max(1, v)) / mx));

  return `<div class="fun">${st.map(([n, v], i) => `<div class="fbar" style="width:${w(v).toFixed(0)}%;--o:${1 - i * .22}"><b>${fmt(Math.round(v))}</b><span>${n}</span></div>${i < 2 ? `<div class="frate">↓ ${pct(rate[i][1], 2)} <span>${rate[i][0]}</span></div>` : ''}`).join('')}</div>`;
}

// a face or a logo for whoever sent the message
function senderAv(ev, i) {
  const f = ev.from || '', d = i.data || {};
  const box = (inner, bg) => `<span class="sav" style="background:${bg}">${inner}</span>`;
  if (i.eid === 'team') { const t = state.team.slice(0, 3); return t.length ? `<span class="savs">${t.map(m => avatarSVG(m.id, 26)).join('')}</span>` : box('👥', 'var(--panel-2)'); }
  if (d.h || d.handle || f.startsWith('@')) return `<span class="sav">${avatarSVG(d.h || d.handle || f, 26)}</span>`;
  if (/Meta/.test(f)) return box(PLOGO.meta, '#E7EDFF');
  if (/TikTok/.test(f)) return box(PLOGO.tiktok, '#151A30;color:#fff');
  if (/App Store|Apple/.test(f)) return box(PLOGO.ios, '#F0F0F3');
  const map = [[/Bank|Gerald/, '🏦', '#FFF3D6'], [/angel|Capital|Ventures|Angels|investor/i, '💼', '#E9F3EC'], [/Support|Customer/, '🎧', '#FFE3EA'], [/TechCrunch|News|Press/, '📰', '#EEF0F6'], [/Season|Calendar/, '📅', '#FFEFE0'], [/Intel|competitor/i, '🕵️', '#EEF0F6'], [/Founder/, '✍️', 'var(--accent-soft)'], [/Influencer|Creator/, '⭐', '#FFF6D6'], [/Group|Founders/, '💬', '#E8F4FF'], [/Operations|Team/, '⚙️', '#EEF0F6']];
  for (const [re, ic, bg] of map) if (re.test(f)) return box(ic, bg);
  return box(esc(f.slice(0, 1)), 'var(--panel-2)');
}

  newGame: () => { closeModal(); state = null; draft = { country: 'US', name: '', cat: 'fitness', price: 'orta', tone: 'samimi', color: 0, model: 'subs', icon: 'letter', letter: '', fg: 0 }; try { localStorage.removeItem(SAVE_KEY); } catch (e) { } render(); window.scrollTo(0, 0); },
};
(() => {
  const tip = document.createElement('div'); tip.id = 'htip'; document.body.appendChild(tip); let cur = null;
  document.addEventListener('mouseover', e => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (el === cur) return; cur = el;
    if (!el) { tip.classList.remove('on'); return; }
    tip.textContent = el.dataset.tip; tip.classList.add('on');
    const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    let x = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8), y = r.bottom + 8;
    if (y + h > innerHeight - 8) y = r.top - h - 8;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  });
  document.addEventListener('scroll', () => { cur = null; tip.classList.remove('on'); }, true);
})();
document.addEventListener('keydown', e => {
  if (!state || state.tab !== 'office' || !officeSel || e.metaKey || e.ctrlKey || e.altKey || /input|textarea|select/i.test((e.target.tagName || ''))) return;
  const k = { 1: 'tip', 2: 'work', 3: 'fun' }[e.key]; if (k) ACT.officeTalk({ id: officeSel, cat: k });
});
// Space = continue: report steps first, otherwise End week
let spaceHit = false;
document.addEventListener('keydown', e => {
  if (e.code !== 'Space' && e.key !== ' ') return;
  const t = e.target; if (e.metaKey || e.ctrlKey || e.altKey || /input|textarea|select/i.test(t.tagName || '') || t.isContentEditable) return;
  e.preventDefault(); if (e.repeat || busy) return;
  // tutorial and guide popups first, then the report flow, then End week
  const pop = document.querySelector('button.primary[data-act="tour"], button.primary[data-act="tourEnd"], button[data-act="guideDone"]');
  const ov = document.querySelector('#modal .overlay');
  const el = pop || (ov ? ov.querySelector('[data-act="loadDone"], button[data-act="closeReport"]:not([aria-label]):not(#rst-no)') : document.querySelector('button[data-act="endWeek"]'));
  if (el && !el.disabled) { spaceHit = true; el.click(); }
});
document.addEventListener('keyup', e => { if ((e.code === 'Space' || e.key === ' ') && spaceHit) { spaceHit = false; e.preventDefault(); } });
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const act = el.dataset.act, slow = SLOW[act] || (INSTANT.has(act) || el.tagName !== 'BUTTON' ? null : [[null], 260]);
  if (slow && el.tagName === 'BUTTON') {
    if (busy) return;
    busy = true;
    const data = { ...el.dataset }, fast = reduceMotion();
    const dur = fast ? slow[1] * .35 : slow[1], steps = slow[0];
    el.style.minWidth = el.offsetWidth + 'px'; el.classList.add('loading'); el.disabled = true;
    const label = el.innerHTML;
    let k = 0; const show = () => { const t = steps[Math.min(k, steps.length - 1)]; el.innerHTML = `<span class="spin"></span>${t == null ? label : t}`; };
    show(); const iv = setInterval(() => { k++; show(); }, dur / steps.length);
    setTimeout(() => { clearInterval(iv); busy = false; try { ACT[act]?.(data, el); } finally { if (el.isConnected) { el.innerHTML = label; el.disabled = false; el.classList.remove('loading'); el.style.minWidth = ''; } } }, dur);
    return;
  }
  ACT[act]?.(el.dataset, el);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.budget) {
    const ch = t.dataset.budget; state.ads[ch].budget = +t.value;
    document.getElementById('bl-' + ch).textContent = money(+t.value);
  } else if (t.dataset.gh || t.dataset.gd) {
    const g = state.gcopy; if (t.dataset.gh) g.head[+t.dataset.gh] = t.value; else g.desc[+t.dataset.gd] = t.value;
    const st = gStrength(g, state.brand), pv = document.getElementById('gprev'); if (pv) pv.innerHTML = gPreview();
    const el = document.getElementById('gstr'); if (el) el.textContent = gLabel(st);
    const bar = document.getElementById('gbar'); if (bar) bar.innerHTML = [0, 1, 2, 3].map(k => `<i class="${st > k / 4 + .05 ? 'on' : ''}"></i>`).join('');
    save();
  } else if (t.dataset.cbudget) {
    const cp = state.camps.find(x => x.id === t.dataset.cbudget); if (cp) cp.budget = +t.value;
    document.getElementById('cbl-' + t.dataset.cbudget).textContent = money(+t.value);
  } else if ('crbudget' in t.dataset) {
    state.crBudget = +t.value;
    document.getElementById('crbl').innerHTML = `${money(+t.value)}<small> / ${money(crBudgetMax())}</small>`;
    const bb = document.getElementById('crbb'); if (bb) bb.textContent = `+${dec(crBoost() * 100, 1)} pts`;
    const w = document.getElementById('wchance'); if (w) w.textContent = pct(weekWinnerChance(), 0);
  } else if (t.dataset.pw || t.dataset.pwp || t.dataset.pwf) {
    const P = state.pw, c = P.vars[P.edit];
    if (t.dataset.pw) c[t.dataset.pw] = t.value;
    else if (t.dataset.pwf) c.feats[+t.dataset.pwf] = t.value;
    else { const [i, f] = t.dataset.pwp.split(':'); c.plans[+i][f] = f === 'price' ? clamp(+t.value || .99, .99, 999) : t.value; }
    pwEdited();
    const pv = document.getElementById('pwprev'); if (pv) pv.firstElementChild.outerHTML = pwPreview(c);
    save();
  } else if ('draftletter' in t.dataset) {
    draft.letter = t.value.slice(0, 2);
    document.getElementById('pvmark').innerHTML = logoInner(draft);
  } else if ('seedn' in t.dataset) {
    state.inf.seedN = +t.value; const el = document.getElementById('seed-l'); if (el) el.textContent = `${t.value} × ${money(SEED_EACH)} = ${money(+t.value * SEED_EACH)}`;
  } else if ('ugcq' in t.dataset) {
    state.ugc.qty = +t.value; const el = document.getElementById('ugc-ql'); if (el) el.textContent = `${t.value} × ${money(ugcPrice())} = ${money(+t.value * ugcPrice())}`;
  } else if (t.dataset.infpct) {
    const I = state.inf, c = I.found.find(x => x.id === I.open); I.pct = +t.value;
    const el = document.getElementById('inf-offer'); if (el && c) el.textContent = `${t.value}% of asking · ${money(infOfferPrice(c))}`;
  } else if ('draftname' in t.dataset) {
    draft.name = t.value;
    document.getElementById('pvname').textContent = t.value || 'Your brand';
    if (draft.icon === 'letter' && !draft.letter.trim()) document.getElementById('pvmark').textContent = upper(t.value);
    const bl = document.getElementById('blet'); if (bl) bl.placeholder = upper(t.value);
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.budget || t.dataset.cbudget || 'crbudget' in t.dataset || 'seedn' in t.dataset) { save(); t.blur(); render(); }
  else if ('draftcountry' in t.dataset) { draft.country = t.value; }
  else if ('draftseed' in t.dataset) { draft.seed = t.value.replace(/[^a-z0-9]/gi, '').toUpperCase(); }
  else if ('huntrole' in t.dataset) { state.huntRole = t.value; save(); }
  else if (t.dataset.pickcr) { if (t.checked) ui.sel.add(t.dataset.pickcr); else ui.sel.delete(t.dataset.pickcr); const b = document.getElementById('pick-n'); if (b) b.textContent = `Add selected (${ui.sel.size})`; }
  else if (t.dataset.pwsel) { const c = state.pw.vars[state.pw.edit]; c[t.dataset.pwsel] = t.dataset.pwsel === 'badgeIdx' ? +t.value : t.value; pwEdited(); save(); t.blur(); render(); pwFlash(); }
});

// ---------- boot ----------
function pwEdited() {
  const P = state.pw;
  if (pwTesting() && P.tot && P.tot[0].vis) { P.tot = null; P.hist = []; toast('Test results reset because a variant changed.'); }
}
// hidden clock: counts only while the Paywall Lab is open, visible and you've touched something in the last 45s
let pwLastAct = 0;
for (const ev of ['pointerdown', 'keydown', 'input', 'wheel']) document.addEventListener(ev, () => { pwLastAct = Date.now(); }, { passive: true });
document.addEventListener('pointermove', () => { pwLastAct = Date.now(); }, { passive: true });
setInterval(() => {
  if (!state || !state.pw || state.over || state.brand.model === 'ads' || state.tab !== 'paywall' || document.visibilityState !== 'visible' || Date.now() - pwLastAct > 45000) return;
  const P = state.pw; P.time++;
  if (P.time % 10 === 0) save();
  const marks = [60, 240, 600, 1200];
  if (P.said < marks.length && P.time >= marks[P.said]) { say('founder', PW_LINES[P.said]); P.said++; save(); }
}, 1000);
let cdLeft = 899;
setInterval(() => { cdLeft = cdLeft > 0 ? cdLeft - 1 : 899; document.querySelectorAll('.pwcd').forEach(el => { el.textContent = String(Math.floor(cdLeft / 60)).padStart(2, '0') + ':' + String(cdLeft % 60).padStart(2, '0'); }); }, 1000);
function boot(data) {
  state = (data && data.state) || load();
  ensurePw(state);
  ensureExtras(state);
  render();
  if (state && state.over) showFinal();
}
window.claude?.hot?.snapshot?.(() => ({ state }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
